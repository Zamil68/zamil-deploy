services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      BOAT_SECRET: ${BOAT_SECRET}
      SUPER_ADMIN: ${SUPER_ADMIN}
      LAMIX_API_KEY: ${LAMIX_API_KEY}
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      DAEMONS: ${DAEMONS:-1}
    expose:
      - "8787"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
